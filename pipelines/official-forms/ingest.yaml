version: 1
pipeline: official-forms
description: Ingest official forms from government portals

phases:
  ingest:
    description: Fetch form listings and details
    output: data/raw/

  validate:
    description: Normalize to schema and validate
    schema: schemas/official-form.schema.json
    output: data/interim/

  publish:
    description: Transform to dataset format
    output: datasets/official-forms/
