version: 1
pipeline: administrative-procedures
description: Ingest administrative procedures from dichvucong.gov.vn

phases:
  ingest:
    description: Fetch procedure listings and details
    source: registry/sources.yaml (npsp-dichvucong)
    output: data/raw/

  validate:
    description: Normalize to schema and validate
    schema: schemas/administrative-procedure.schema.json
    output: data/interim/

  publish:
    description: Transform to dataset format
    output: datasets/administrative-procedures/
