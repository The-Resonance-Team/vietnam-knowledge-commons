name: Scheduled Source Check

on:
  schedule:
    - cron: "0 8 * * *" # Daily 08:00 UTC

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - run: python scripts/check_sources.py
