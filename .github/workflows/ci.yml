name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python — lint + tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync
        run: uv sync --extra dev

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # ponytail: lightweight PII/secret tripwire, not a full scanner —
  # catches the two failure modes SECURITY.md cares about most.
  data-safety:
    name: Data safety — no credentials, no obvious PII in data files
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Scan registry/schemas for secrets + VN ID patterns
        run: |
          ! grep -rInE '(api[_-]?key|secret|token|password|bearer)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_\-]{16,}' registry schemas
          ! grep -rInE '\b[0-9]{12}\b' registry schemas  # CCCD pattern; legal doc numbers never match
