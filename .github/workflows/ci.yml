name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "10.13.1"

jobs:
  typescript:
    name: TypeScript — format, types, boundaries, tests, registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Deep-module boundaries
        run: pnpm run lint:boundaries

      - name: Tests
        run: pnpm run test

      - name: Validate source registry + examples (CLI)
        run: pnpm run validate

  python:
    name: Python — lint + tests (sdk-python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync
        working-directory: packages/sdk-python
        run: uv sync --frozen

      - name: Ruff
        working-directory: packages/sdk-python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest
        working-directory: packages/sdk-python
        run: uv run pytest

  # ponytail: lightweight PII/secret tripwire, not a full scanner —
  # catches the two failure modes SECURITY.md cares about most.
  data-safety:
    name: Data safety — no credentials, no obvious PII in data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan registry/examples/schemas for secrets + VN ID patterns
        run: |
          ! grep -rInE '(api[_-]?key|secret|token|password|bearer)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_\-]{16,}' registry examples schemas
          ! grep -rInE '\b[0-9]{12}\b' registry examples  # CCCD pattern; legal doc numbers never match
