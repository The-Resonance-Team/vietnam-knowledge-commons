name: Release

# Manual release for now — packages are marked private and will be skipped
# until a maintainer deliberately flips them to public (ROADMAP: first public
# dataset release). Publishing uses Changesets-shaped versions without the
# changesets machinery: bump versions in package.json / pyproject.toml, tag,
# dispatch.
#
# The `on` key is quoted on purpose: bare `on:` is parsed as boolean `true`
# by YAML 1.1 (which GitHub Actions workflows can use), dropping the trigger
# declaration entirely and making GitHub fall back to its default triggers
# (push + pull_request). Quoting keeps the key a string.
"on":
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish public npm packages (@vnkc/*)"
        required: false
        type: boolean
        default: false
      publish_pypi:
        description: "Publish vnkc to PyPI (trusted publishing)"
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "10.13.1"

jobs:
  # Always-on no-op job. GitHub creates a validation run for any workflow file
  # that changes in a push, regardless of the workflow's declared triggers —
  # without this job the release workflow would fail with "no jobs to run"
  # every time the file is edited, because the publish jobs are gated on
  # workflow_dispatch inputs that don't exist on push events.
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Release workflow — trigger manually via the Actions tab."'

  npm:
    if: inputs.publish_npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # ponytail: publishes every non-private workspace package; per-package
      # build/bundling is a publish-readiness task, not a Phase 0 one (ADR-0002).
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: inputs.publish_pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - working-directory: packages/sdk-python
        run: |
          uv sync --frozen
          uv run pytest
          uv build
      - run: uvx pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist/
