name: Validate Datasets

on:
  push:
    paths:
      - "datasets/**"
      - "schemas/**"
  pull_request:
    paths:
      - "datasets/**"
      - "schemas/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python scripts/validate_datasets.py
